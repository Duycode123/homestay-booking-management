spring.datasource.url=jdbc:h2:mem:homestaydb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema.sql
spring.flyway.enabled=false

# schema.sql declares H2 domains for PostgreSQL named enums. The scheduled sweep remains disabled
# in this profile to keep context tests deterministic; expiry behavior has focused service tests.
app.booking.expiry-sweep.enabled=false

# Deterministic test-only key (32 bytes before Base64 encoding).
app.jwt.secret=MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=
# Existing controller tests focus on validation/authorization; CSRF has a dedicated test class.
app.security.csrf.enabled=false

# Keep the OAuth security chain active in context tests so bean wiring regressions
# such as circular dependencies are detected before deployment.
spring.security.oauth2.client.registration.google.client-id=test-google-client
spring.security.oauth2.client.registration.google.client-secret=test-google-secret
spring.security.oauth2.client.registration.google.scope=openid,profile,email
