spring.datasource.url=jdbc:h2:mem:homestaydb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.show-sql=false
spring.sql.init.mode=never

# H2 cannot round-trip PostgreSQL named enums, so the booking-expiry sweep (which runs a real
# repository query) is disabled under the test profile. It is validated against PostgreSQL instead.
app.booking.expiry-sweep.enabled=false
